repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.5.4
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Keep in step with CI: chartboost/ruff-action@v1 is unpinned and installs the
  # latest ruff, so an older rev here disagrees with the linter that gates the PR.
  rev: v0.16.1
  hooks:
      - id: ruff
        types_or: [ python, pyi ]
        args: [ --fix ]
      - id: ruff-format
        types_or: [ python, pyi ]

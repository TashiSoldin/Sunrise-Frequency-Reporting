name: "Run tests"

on: [ "workflow_call" ]

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      # The oracle test needs LibreOffice and a real workbook, so it stays
      # deselected here — run it locally with --workbook before a release.
      - name: Run tests
        run: uv run pytest -q
